name: Validate application syntax
on:
  push:
    branches:
      - cook-better-major-update
  pull_request:
    branches:
      - cook-better-major-update
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server and browser JavaScript syntax
        run: |
          node --check api/index.js
          node --check assets/major-update.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1])
            .filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((source, index) => {
            const file = '/tmp/cook-better-inline-' + index + '.js';
            fs.writeFileSync(file, source);
            console.log('Extracted inline script', index + 1, 'to', file);
          });
          NODE
          for script in /tmp/cook-better-inline-*.js; do node --check "$script"; done
