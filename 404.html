<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Cook Better Co.</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #f5f5f5;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 132, 0, .18), transparent 68%);
      top: -260px;
      right: -180px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(43, 190, 104, .10), transparent 68%);
      bottom: -250px;
      left: -180px;
      pointer-events: none;
    }

    .card {
      width: min(680px, calc(100% - 40px));
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 56px 34px;
      border: 1px solid #292929;
      border-radius: 28px;
      background: rgba(18, 18, 18, .88);
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff9d2e, #e85c00);
      color: #111;
      font-size: 21px;
      box-shadow: 0 8px 25px rgba(255, 113, 0, .25);
    }

    .number {
      margin: 0;
      font-size: clamp(100px, 22vw, 190px);
      line-height: .8;
      font-weight: 900;
      letter-spacing: -12px;
      color: #ff8a1f;
      text-shadow: 0 0 55px rgba(255, 119, 0, .18);
    }

    h1 {
      margin: 36px 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1px;
    }

    p {
      margin: 0 auto;
      max-width: 500px;
      color: #a9a9a9;
      font-size: 16px;
      line-height: 1.65;
    }

    .buttons {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      font-weight: 800;
      padding: 14px 22px;
      border-radius: 12px;
      transition: transform .18s ease, opacity .18s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    .primary {
      color: #111;
      background: #ff8a1f;
    }

    .secondary {
      color: #f4f4f4;
      background: #242424;
      border: 1px solid #353535;
    }

    .tip {
      margin-top: 26px;
      font-size: 13px;
      color: #666;
    }

    .tip span {
      color: #7bcf9b;
    }

    @media (max-width: 520px) {
      .card {
        padding: 44px 22px;
      }

      .number {
        letter-spacing: -7px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <div class="logo-mark">🍳</div>
      Cook Better Co.
    </div>

    <div class="number">404</div>

    <h1>Oops — this recipe got lost.</h1>

    <p>
      The page you're looking for doesn't exist, moved somewhere else,
      or maybe the ingredients weren't quite right.
    </p>

    <div class="buttons">
      <a class="primary" href="/">Back to Cook Better Co.</a>
      <a class="secondary" href="javascript:history.back()">Go Back</a>
    </div>

    <div class="tip">
      <span>Cook better.</span> Find your way back to something delicious.
    </div>
  </main>
</body>
</html>
